# Research (research/writeups/three-tier-routing). JSQ with three priority tiers: requests carry their
# family's class P1, P2 or P3 as the objective header (semi-closed DAG slo_class). Servers are
# labelled by BLIS_RESEARCH_INSTANCE_LABELS: research.blis/tier=p1 (P1 only), =p12 (P1 and P2),
# unlabelled (everyone). P1 uses JSQ over every server, P2 over the non-p1 servers, P3 over the
# unlabelled ones.
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
featureGates: ["flowControl=false"]
plugins:
- type: token-producer
- type: inflight-load-producer
  parameters:
    addEstimatedOutputTokens: false
- type: active-request-scorer
- type: max-score-picker
- type: header-profile-handler
  parameters:
    headerName: x-llm-d-inference-objective
    defaultProfile: P3
- type: label-selector-filter
  name: not-p1
  parameters:
    matchExpressions:
    - key: research.blis/tier
      operator: NotIn
      values: [p1]
- type: label-selector-filter
  name: shared-only
  parameters:
    matchExpressions:
    - key: research.blis/tier
      operator: DoesNotExist
- type: utilization-detector
  name: pool-utilization
- type: max-saturation-detector
  name: pool-saturation
  parameters:
    detectors: [pool-utilization]
flowControl:
  saturationDetector:
    pluginRef: pool-saturation
schedulingProfiles:
- name: P1
  plugins:
  - pluginRef: active-request-scorer
    weight: 1
  - pluginRef: max-score-picker
- name: P2
  plugins:
  - pluginRef: not-p1
  - pluginRef: active-request-scorer
    weight: 1
  - pluginRef: max-score-picker
- name: P3
  plugins:
  - pluginRef: shared-only
  - pluginRef: active-request-scorer
    weight: 1
  - pluginRef: max-score-picker
